quality:
  nfrs:
    - {id: NFR-01, statement: "Disponibilidad 99,9 % en fallas normales; RTO 4 h y RPO 1 h con respaldos horarios en desastre (INF-DEC-23).", classification: "FACT (INF-Q02, 2026-10-10)"}
    - {id: NFR-02, statement: "Más de 50 colaboradores; resto de la carga desconocido.", classification: "FACT parcial (INF-Q03); resto UNKNOWN"}
    - {id: NFR-03, statement: "Retención por siempre de los logs de carga y de los datos personales.", classification: "FACT (BR-090, BR-101)"}
    - {id: NFR-04, statement: "Tiempos en UTC (`DATETIME(3)`); la presentación en UTC-05 es del cliente (BR-092).", classification: "FACT"}
    - {id: NFR-05, statement: "Zona horaria del servidor `+00:00`, modo SQL estricto, versión mínima 8.0.16.", classification: "FACT (PDM-001 §6, preflight)"}
security:
  constraints:
    - {id: SEC-01, constraint: "Todas las cuentas MySQL exigen SSL; los hosts `%` se restringen a la red de los servicios al desplegar.", source: "PDM-001 §5; INF-DEC-07"}
    - {id: SEC-02, constraint: "Mínimo privilegio por tabla y por columna (`persona_ref`); ningún servicio lee otro esquema.", source: "PDM-001 §5; INF-DEC-15"}
    - {id: SEC-03, constraint: "Contraseñas en Vault bajo `secret/p3m/*`; los scripts usan marcadores y nunca se escriben valores.", source: "ADR-12; INF-DEC-14"}
    - {id: SEC-04, constraint: "No hay registro libre ni auto-registro; las identidades vienen de Active Directory vía Keycloak y el correo es de solo lectura. Es un requisito de despliegue: si cambia, vuelve el riesgo de suplantación (RPT-DDR-001 R-01).", source: "INF-DEC-22; BRC-001 BR-128"}
    - {id: SEC-05, constraint: "Las llamadas internas usan un JWT de máquina OAuth2 Client Credentials; las rutas `/internal/…` no se publican en el API Gateway.", source: "ADR-P9; ICP-001 §5"}
    - {id: SEC-06, constraint: "Los mensajes entre contextos no llevan datos personales; los registros de integración tampoco.", source: "ICP-001 P-5"}
    - {id: SEC-07, constraint: "Los datos personales se retienen por siempre y no hay mecanismo de borrado; la clasificación y el cifrado de columna están diferidos (DT-01). **No debilitar los controles que ya existen.**", source: "BR-101; ADR-P4 aprobada con el aplazamiento DT-01"}
    - {id: SEC-08, constraint: "Una URL de issue solo se acepta bajo la URL base de GitLab configurada en Vault.", source: "ICP-001 §2.3 (ACL-02)"}
open_items:
  - {id: OI-01, type: OPEN_DECISION, description: "**Resuelto en parte.** ianache aprobó el 2026-10-12 ADR-P2, P3, P6, P7, P9 y ADR-DB-001/002/003, en su rol de responsable funcional. **ADR-P5 no se aprobó** (OI-04, OI-18). No consta la revisión de un arquitecto distinto. Las reglas ARCH-RULE siguen en `PROPOSED` hasta que el Solution Architect las apruebe.", blocking: "No", owner: "Solution Architect"}
  - {id: OI-02, type: MISSING_EVIDENCE, description: "Los 20 ASR tienen disposición humana PENDIENTE. Ninguno está clasificado como `CANDIDATE`, `REJECT` o `INVESTIGATE`.", blocking: "No", owner: "Solution Architect"}
  - {id: OI-03, type: OPEN_DECISION, description: "ADR-P4 (datos personales) fue **aprobada el 2026-10-12** y su decisión es aplazar la política (DT-01): sin clasificación, cifrado de columna, acceso ni borrado a solicitud del titular; los datos personales se retienen por siempre (BR-101). **Seguridad aceptó el aplazamiento (DT-01)** según ianache el 2026-10-12; no consta el nombre del aceptante ni una referencia.", blocking: "No para el esquema. Sí antes de producción decidir ADR-P4", owner: "Seguridad y responsable funcional"}
  - {id: OI-04, type: FACT, description: "**RESUELTO el 2026-10-12:** ianache respondió P5-D1 a P5-D7 y aprobó ADR-P5 (con su anexo). Antes: ADR-P5: el mapa rol-permiso está **propuesto** en `ADR-P5-anexo-mapa-rol-permiso-propuesta.md` y **no aprobado**. Hay 7 decisiones pendientes (P5-D1 a P5-D7). Los permisos de negocio (BR-002, BR-005, BR-055, BR-109 y otros) los aplica el servicio.", blocking: "No para el esquema. Sí para la capa de servicios", owner: "Arquitectura y responsable funcional"}
  - {id: OI-05, type: OPEN_DECISION, description: "Alojamiento y modo de alta disponibilidad de MySQL: ¿servicio gestionado o contenedor?, ¿replicación semisíncrona o de grupo? (INF-DEC-11). INF-DEC-23 exige conmutación en minutos.", blocking: "No para las migraciones. Sí antes de producción", owner: "Arquitectura e infraestructura"}
  - {id: OI-06, type: MISSING_EVIDENCE, description: "La recuperación de MySQL no está verificada: sin conmutación ni restauración de prueba contra 99,9 % / RTO 4 h / RPO 1 h. **Aceptado como deuda técnica DT-04** (D-H39), confirmado por ianache el 2026-10-12 (D-H43).", blocking: "No", owner: "Infraestructura"}
  - {id: OI-07, type: UNKNOWN, description: "Carga parcial: más de 50 colaboradores. Faltan usuarios concurrentes, volumen de issues, crecimiento e IOPS (DT-02). Los índices cubren solo restricciones y consultas de contrato.", blocking: "No", owner: "Arquitectura"}
  - {id: OI-08, type: OPEN_DECISION, description: "Issues de tipo «Proyecto» (BR-039) y campos que BR-038 manda mostrar (esfuerzo estimado, esfuerzo gastado, fecha de vencimiento): la réplica no los guarda (DT-03).", blocking: "No", owner: "Jefe de Ingeniería"}
  - {id: OI-09, type: ASSUMPTION, description: "Ningún ambiente aplicó los `V1` anteriores de `p3m_partes`, `p3m_identidad` y `p3m_portafolio`. El responsable aprobó F-18 sin confirmarlo expresamente.", blocking: "No", owner: "Responsable funcional"}
  - {id: OI-10, type: STALE_EVIDENCE, description: "**Resuelto en parte.** IMD-001, BRC-001, RCP-001 y las seis historias actualizadas fueron **verificadas por ianache el 2026-10-12** (D-H41). Siguen desfasados los issues de GitLab #17, #19 y #21 y TRC-SSP-001, que reflejan la versión anterior de las historias. Las historias US-029 a US-035 son nuevas y están en `draft`.", blocking: "No", owner: "Análisis funcional"}
  - {id: OI-11, type: UNKNOWN, description: "**Resuelto en parte.** Se redactaron el 2026-10-12 las historias US-029 (contactos), US-030 (plazas), US-031 (ocupaciones), US-032 (roles de la parte), US-033 (corrección de vínculo) y US-034 (relaciones). Cinco están CONDITIONAL y una READY; todas en `draft`. **Se redactó después US-035 para el registro de las organizaciones** (BR-072).", blocking: "No", owner: "Análisis funcional"}
  - {id: OI-12, type: ASSUMPTION, description: "Se asume un servicio por contexto (7). ADR-P2 dice que falta enumerar los servicios; DDM-001 enumera contextos, no servicios.", blocking: "No", owner: "Arquitectura"}
  - {id: OI-13, type: OPEN_DECISION, description: "Parámetros operativos de los contratos internos (tiempos de espera, circuit breaker, reintentos). ADR-09 solo propone parámetros para GitLab.", blocking: "No para el esquema. Sí para los servicios", owner: "Infraestructura"}
  - {id: OI-14, type: UNKNOWN, description: "Preguntas abiertas de las historias que afectan a la implementación: US-010-Q2 (el desenrolamiento y el registro), US-025-Q1 y US-025-Q2 (datos que no entrega Keycloak; correo ya vinculado), RQ-32 (permiso del jefe de proyecto), RQ-33 (roles de la parte simultáneos), RQ-22 (actualizar el usuario en cada inicio).", blocking: "No", owner: "Jefe de Ingeniería"}
  - {id: OI-15, type: UNKNOWN, description: "INF-Q17: cómo se federa Keycloak con Active Directory y qué pasa si no responde. Afecta al ingreso (US-025, US-027).", blocking: "No", owner: "Infraestructura y seguridad"}
  - {id: OI-16, type: CONFLICT, description: "INF-P3M-001 mantiene INF-DEC-02 como «PENDIENTE» (plataforma de contenedores) mientras ADR-P7 decide Docker local y Kubernetes en Oracle OKE. Queda por confirmar si DEV también va en OKE.", blocking: "No", owner: "Arquitectura"}
  - {id: OI-17, type: OPEN_DECISION, description: "Fuera de este alcance: US-027 y US-028 (ingreso y cierre de sesión) no usan la base de datos; los resuelven el BFF y Keycloak.", blocking: "No", owner: "Arquitectura"}
  - {id: OI-18, type: FACT, description: "**RESUELTO el 2026-10-12 (P5-D1 = A):** el BFF reenvía el token del usuario además del JWT de máquina y cada servicio lo valida contra Keycloak; ADR-P9 no cambia. Antes: ADR-P5 dice que cada microservicio valida el rol del usuario; ADR-P9 (aprobado) hace que el BFF llame con un JWT de máquina, no el del usuario. El servicio no recibe la identidad ni los roles del usuario, ni el GUID del actor que exige ARCH-RULE-012. Opciones y recomendación en el anexo de ADR-P5 (G-1).", blocking: "No para el esquema. **Sí para implementar los servicios**", owner: "Arquitectura y responsable funcional"}
  - {id: OI-19, type: FACT, description: "RESUELTO el 2026-10-12 (D-160, BR-131: toda parte tiene contactos; F-19). Faltan tipos y obligatoriedad para organizaciones (RQ-36). Antes: BR-121 y D-150 dicen que solo las personas tienen contactos; el responsable indicó el 2026-10-12 «contactos de las Party (Person u Organization)». Afecta a `dato_de_contacto`, que hoy solo se relaciona con `persona`.", blocking: "Parcial: bloquea la parte de organizaciones de US-029 y un posible cambio del esquema", owner: "Jefe de Ingeniería"}
  - {id: OI-20, type: FACT, description: "**RESUELTO el 2026-10-12 (D-166, BR-135):** los mantienen el Jefe de Ingeniería y el ADMIN. Antes: Ninguna regla dice quién mantiene los contactos, plazas, ocupaciones, roles de la parte y relaciones. Las historias lo asumen como hipótesis (Jefe de Ingeniería o ADMIN, por analogía con BR-002).", blocking: "No para el esquema", owner: "Jefe de Ingeniería"}
  - {id: OI-21, type: ASSUMPTION, description: "Los nombres de rol de Keycloak (ADMIN, COLABORADOR, INSTRUCTOR, JEFE_INGENIERIA) son un supuesto del responsable (D-164); no se contrastaron con la configuración real de Keycloak. El DDL (`ck_usuario_rol`) y ACL-01 ya los usan.", blocking: "No para el esquema. Sí para implementar los servicios", owner: "Infraestructura / responsable funcional"}
  - {id: OI-22, type: STALE_EVIDENCE, description: "BR-134 (D-165): el ADMIN suple las seis capacidades exclusivas del Jefe de Ingeniería. Las historias aprobadas US-002, US-003, US-006, US-007, US-008, US-017, US-021, US-022 y US-026 aún dicen «solo el Jefe de Ingeniería». Cambiarlas devuelve a `draft` lo verificado.", blocking: "No para el esquema", owner: "Jefe de Ingeniería"}
