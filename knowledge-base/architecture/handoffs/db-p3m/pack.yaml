architecture:
  affected_components:
    - {component: "`p3m_partes` (CTX-01)", responsibility: "Partes y organización: parte, persona, organización, contactos, roles de la parte, relaciones, plazas y ocupaciones. 9 tablas"}
    - {component: "`p3m_identidad` (CTX-02)", responsibility: "Usuario vinculado a Keycloak y corrección de vínculo. 3 tablas"}
    - {component: "`p3m_curricula` (CTX-03)", responsibility: "Seniority, niveles, competencias, roles y rol/nivel. 8 tablas y semillas BR-011"}
    - {component: "`p3m_formacion` (CTX-04)", responsibility: "Cursos, objetivos, rúbricas, evidencias esperadas, ediciones, enrolamientos y certificaciones. 7 tablas"}
    - {component: "`p3m_progresion` (CTX-05)", responsibility: "Evidencias aportadas, valoraciones, evaluaciones de desempeño, solicitudes y promociones, y el outbox de EVT-01. 12 tablas"}
    - {component: "`p3m_portafolio` (CTX-06)", responsibility: "Productos, proyectos, jefaturas, asignaciones, excepciones, motivos y fila de bloqueo por colaborador. 9 tablas"}
    - {component: "`p3m_gitlab` (CTX-07)", responsibility: "Registro de cargas y réplica de solo lectura de milestones e issues. 3 tablas"}
    - {component: "Servicio por contexto (nombre y número **por definir**)", responsibility: "Aplica las restricciones que la base no garantiza (R-014) y expone los contratos de ICP-001. FastAPI (ADR-07)"}
    - {component: "Cuentas MySQL `flyway_<ctx>`, `svc_<ctx>`, `svc_gitlab_carga`, `svc_identidad_correccion`", responsibility: "Migraciones y acceso con mínimo privilegio"}
    - {component: "RabbitMQ", responsibility: "Entrega de EVT-01 con outbox"}
    - {component: "Keycloak (federado con Active Directory) y GitLab", responsibility: "Capas anticorrupción ACL-01 y ACL-02"}
  asrs:
    - {id: ASR-03, requirement: "Roles de usuario en Keycloak; el portal registra al usuario al iniciar sesión", disposition: PENDIENTE}
    - {id: ASR-04, requirement: "Integración con GitLab de solo lectura", disposition: PENDIENTE}
    - {id: ASR-05, requirement: "Carga automática y programada, con delta", disposition: PENDIENTE}
    - {id: ASR-06, requirement: "Reintentos con esperas incrementales y circuit breaker", disposition: PENDIENTE}
    - {id: ASR-07, requirement: "Aviso «datos al …» si GitLab no responde", disposition: PENDIENTE}
    - {id: ASR-08, requirement: "Logs de carga por siempre; la evaluación registra fecha, hora y usuario", disposition: PENDIENTE}
    - {id: ASR-09, requirement: "Historiales con vigencia: rol/nivel, asignaciones, jefe de proyecto, «reporta a», membresía, valoraciones y evaluaciones", disposition: PENDIENTE}
    - {id: ASR-10, requirement: "Restricciones garantizadas: suma de dedicación ≤ 100 %, un milestone por proyecto, una membresía y un jefe vigentes, evaluación obligatoria para promover, evidencias solo de issues cerrados", disposition: PENDIENTE}
    - {id: ASR-11, requirement: "Registro de colaboradores alineado con el UDM (Party Management)", disposition: PENDIENTE}
    - {id: ASR-14, requirement: "Tratamiento de datos personales (política pendiente)", disposition: PENDIENTE}
    - {id: ASR-16, requirement: "MySQL 8.x, microservicios en Python con FastAPI", disposition: PENDIENTE}
    - {id: ASR-17, requirement: "Parámetros y datos sensibles en Vault bajo `secret/p3m/*`", disposition: PENDIENTE}
    - {id: ASR-18, requirement: "Protocolo de consumo seguro entre el BFF y los microservicios", disposition: PENDIENTE}
    - {id: ASR-20, requirement: "Plataforma contenerizada", disposition: PENDIENTE}
  adrs:
    - {id: ADR-DB-001, decision: "El SSOT de un concepto se registra antes de modelar; el esquema no crea propiedad de negocio", status: "Aprobado por ianache el 2026-10-12 (sin revisión de arquitecto distinto)"}
    - {id: ADR-DB-002, decision: "Cada contexto posee sus agregados y su persistencia; datos entre contextos por contratos, identificadores o ACL; sin tablas compartidas", status: "Aprobado por ianache el 2026-10-12 (sin revisión de arquitecto distinto)"}
    - {id: ADR-DB-003, decision: "MySQL 8.x con charset y collation explícitos e índices; migraciones Flyway versionadas y observables; cambios destructivos solo con expand/contract o forward-fix aprobado", status: "Aprobado por ianache el 2026-10-12 (sin revisión de arquitecto distinto)"}
    - {id: ADR-05, decision: "La base de datos es MySQL 8.x", status: "Aceptada"}
    - {id: ADR-07, decision: "Microservicios en Python con FastAPI", status: "Aceptada"}
    - {id: ADR-08, decision: "Integración con GitLab de solo lectura, con carga programada y delta", status: "Aceptada"}
    - {id: ADR-09, decision: "Reintentos con esperas incrementales y circuit breaker", status: "Aceptada el patrón; parámetros propuestos"}
    - {id: ADR-10, decision: "Modelo de personas y organizaciones alineado con el UDM", status: "Aceptada; la correspondencia concreta es propuesta"}
    - {id: ADR-11, decision: "Identidad y roles de usuario gestionados en Keycloak; el portal guarda el GUID", status: "Aceptada; falta decidir si se actualiza en cada inicio (RQ-22)"}
    - {id: ADR-12, decision: "Secretos y parámetros en HashiCorp Vault", status: "Aceptada; faltan rotación y autenticación (ADR-P11)"}
    - {id: ADR-P2, decision: "Microservicios delimitados con DDD; REST seguro síncrono y RabbitMQ como único mensajero", status: "Aprobada por ianache el 2026-10-12 (sin revisión de arquitecto distinto)"}
    - {id: ADR-P3, decision: "La carga de GitLab corre como proceso independiente con Celery Beat y workers", status: "Aprobada por ianache el 2026-10-12 (sin revisión de arquitecto distinto)"}
    - {id: ADR-P6, decision: "Historial con vigencia y «una sola vigente» por índice único sobre columna calculada; la suma ≤ 100 % se valida en el servicio con bloqueo de filas", status: "Aprobada por ianache el 2026-10-12 (sin revisión de arquitecto distinto)"}
    - {id: ADR-P9, decision: "El BFF obtiene un JWT de máquina con OAuth2 Client Credentials y lo presenta a los microservicios", status: "Aprobada por ianache el 2026-10-12 (sin revisión de arquitecto distinto)"}
    - {id: ADR-P4, decision: "Tratamiento de datos personales: clasificación, cifrado, acceso y retención", status: "**Aprobada** por ianache el 2026-10-12: la decisión es retener los datos personales como los logs y aplazar la política (DT-01)"}
    - {id: ADR-P5, decision: "Autorización por roles: guards en Angular y validación en servidor", status: "**Aprobada** por ianache el 2026-10-12: el BFF reenvía el token del usuario además del JWT de máquina; cada servicio comprueba rol más condición del recurso"}
  rules:
    - {id: ARCH-RULE-001, statement: "MUST: cada contexto tiene su propio esquema; no hay claves foráneas ni tablas compartidas entre esquemas; cada servicio accede solo a su esquema.", status: PROPOSED, severity: REQUIRED, sources: "ADR-DB-002, ADR-P2, INF-DEC-15; ASR-16", fitness: FIT-001}
    - {id: ARCH-RULE-002, statement: "MUST: MySQL 8.x (mínimo 8.0.16), InnoDB, `utf8mb4` y `utf8mb4_0900_ai_ci` explícitos; `issue_url` y `web_url` con `utf8mb4_bin`; GUID de Keycloak en `ascii_bin`.", status: PROPOSED, severity: REQUIRED, sources: "ADR-DB-003, ADR-05; ASR-16", fitness: FIT-002}
    - {id: ARCH-RULE-003, statement: "MUST: todo cambio de esquema es una migración Flyway versionada e inmutable (`validateOnMigrate=true`, `cleanDisabled=true`). Los cambios destructivos exigen expand/contract o forward-fix aprobado. Una migración aplicada no se edita.", status: PROPOSED, severity: REQUIRED, sources: "ADR-DB-003", fitness: FIT-003}
    - {id: ARCH-RULE-004, statement: "MUST: los historiales con vigencia no se borran. «Una sola vigente» se garantiza con un índice único sobre una columna generada.", status: PROPOSED, severity: REQUIRED, sources: "ADR-P6; ASR-09, ASR-10", fitness: FIT-004}
    - {id: ARCH-RULE-005, statement: "MUST: antes de sumar la dedicación de un colaborador, la transacción hace `INSERT IGNORE` y `SELECT … FOR UPDATE` sobre su fila de `colaborador_carga`, con cualquier nivel de aislamiento; reintenta ante el error 1213.", status: PROPOSED, severity: REQUIRED, sources: "ADR-P6; ASR-10 (PDM-001 F-15)", fitness: FIT-005}
    - {id: ARCH-RULE-006, statement: "MUST: mínimo privilegio por tabla. Sin `DELETE` salvo en `rol_competencia`, `rol_nivel_competencia_minimo`, `proyecto_milestone`, `proyecto_rol_nivel_requerido` y `usuario_rol_de_usuario`. Sin `UPDATE` ni `DELETE` en las tablas de solo inserción. Sin `DELETE` en `carga_de_gitlab`.", status: PROPOSED, severity: REQUIRED, sources: "INF-DEC-15; ASR-08, ASR-09 (PDM-001 §5, D-H28)", fitness: FIT-006}
    - {id: ARCH-RULE-007, statement: "MUST: toda conexión a MySQL usa SSL. Las contraseñas viven en Vault bajo `secret/p3m/*` y nunca en el repositorio, las imágenes ni las migraciones.", status: PROPOSED, severity: REQUIRED, sources: "ADR-12; ASR-17; INF-DEC-07, INF-DEC-14", fitness: FIT-007}
    - {id: ARCH-RULE-008, statement: "MUST: entre contextos solo se intercambia por los contratos de ICP-001 (CON-01 a CON-13, EVT-01). Las referencias a otro contexto son `*_ref` sin clave foránea. MUST NOT leer tablas ajenas.", status: PROPOSED, severity: REQUIRED, sources: "ADR-DB-002, ADR-P2, ADR-P9; ASR-18", fitness: FIT-008}
    - {id: ARCH-RULE-009, statement: "MUST: `PromocionDeNivelDecidida` viaja por RabbitMQ con outbox transaccional. El consumidor es idempotente por `promocion_ref` y descarta, registrando, los eventos con `decidida_en` no posterior a la vigencia actual de la plaza.", status: PROPOSED, severity: REQUIRED, sources: "ADR-P2; ASR-09 (ICP-001 EVT-01, K-42, K-46)", fitness: FIT-009}
    - {id: ARCH-RULE-010, statement: "MUST: la réplica de GitLab es de solo lectura, la escribe solo el proceso de carga y solo guarda issues `UserStory` o `Task`. El proceso de carga ignora y registra los demás issues y MUST NOT fallar por ellos.", status: PROPOSED, severity: REQUIRED, sources: "ADR-08, ADR-P3, ADR-09; ASR-04 a ASR-08 (DT-03)", fitness: FIT-010}
    - {id: ARCH-RULE-011, statement: "MUST: el usuario se vincula con la persona por el correo vigente, único entre las personas, la primera vez que inicia sesión. El vínculo se fija una sola vez; solo la cuenta de corrección lo cambia y deja registro de quién y cuándo. MUST NOT existir registro libre ni auto-registro de cuentas.", status: PROPOSED, severity: REQUIRED, sources: "ADR-11; ASR-03 (ICP-001 CON-13, BRC-001 BR-125, BR-128, BR-129)", fitness: FIT-011}
    - {id: ARCH-RULE-012, statement: "MUST: los actores de las escrituras (`*_por_ref`) se guardan con el GUID de Keycloak (claim `sub`), sin consultar a Identidad. El `sub` sale del token del usuario que el BFF reenvía (ADR-P5).", status: PROPOSED, severity: REQUIRED, sources: "ADR-11 (ICP-001 D-H20); ADR-P5", fitness: FIT-012}
    - {id: ARCH-RULE-013, statement: "MUST NOT: los contratos entre contextos y los eventos llevan datos personales. Solo identificadores, booleanos y niveles. Los registros de integración no contienen datos personales.", status: PROPOSED, severity: REQUIRED, sources: "ASR-14; ICP-001 P-5; ADR-P4 aprobada con el aplazamiento DT-01", fitness: FIT-013}
    - {id: ARCH-RULE-014, statement: "MUST: el servicio implementa y prueba las restricciones que la base no garantiza: K-01, K-07, K-09, K-12, K-13, K-16, K-18, K-20, K-23, K-33 y K-34.", status: PROPOSED, severity: REQUIRED, sources: "ASR-10 (PDM-001 §3, §9)", fitness: FIT-014}
    - {id: ARCH-RULE-015, statement: "SHOULD NOT: añadir particionado, desnormalización ni índices especulativos sin evidencia de carga real.", status: PROPOSED, severity: RECOMMENDED, sources: "PDM-001 F-11; LDM-001 §7 (D-H29)", fitness: FIT-015}
    - {id: ARCH-RULE-016, statement: "MUST: los contratos internos se versionan (`/internal/v1`, `schema_version`), usan un JWT de máquina OAuth2 Client Credentials y evolucionan solo de forma aditiva dentro de una versión mayor.", status: PROPOSED, severity: REQUIRED, sources: "ADR-P9; ASR-18 (ICP-001 §5, §7)", fitness: FIT-016}
  fitness_criteria:
    - {id: FIT-001, rule: ARCH-RULE-001, description: "Ninguna FK cruza esquemas", type: AUTOMATED, evidence: "`python -I flyway/verify/analisis_estatico_ddl.py flyway` y postflight Q3", expected: "0 FK entre esquemas", current_state: "PASS (51 tablas, 46 FK, 0 entre esquemas)"}
    - {id: FIT-002, rule: ARCH-RULE-002, description: "Todas las tablas son InnoDB y `utf8mb4_0900_ai_ci`", type: AUTOMATED, evidence: "Postflight Q1 (`flyway/verify/preflight_postflight.sql`)", expected: "0 tablas fuera de la norma", current_state: "PASS"}
    - {id: FIT-003, rule: ARCH-RULE-003, description: "Migraciones válidas, inmutables y sin cambios destructivos no aprobados", type: HYBRID, evidence: "`flyway migrate` con `validateOnMigrate=true`; checksums de PDM-001 §6; revisión humana de todo `DROP`, `RENAME` o `ALTER` destructivo", expected: "Checksums iguales; sin migración fallida", current_state: "PASS (8 migraciones, checksums coinciden)"}
    - {id: FIT-004, rule: ARCH-RULE-004, description: "«Una sola vigente» y no borrado de historiales", type: AUTOMATED, evidence: "`flyway/verify/pruebas_restricciones.sh` (111 pruebas) y postflight Q6 (7 índices)", expected: "111 de 111; 7 índices únicos", current_state: "PASS"}
    - {id: FIT-005, rule: ARCH-RULE-005, description: "Suma de dedicación ≤ 100 % bajo concurrencia", type: HYBRID, evidence: "`ciclo_completo.sh` (K-31 con `svc_portafolio`, `READ COMMITTED` y `REPEATABLE READ`); prueba del servicio", expected: "Suma 60 % y 0 interbloqueos en ambos niveles", current_state: "PASS en la base; prueba del servicio NOT_VERIFIABLE"}
    - {id: FIT-006, rule: ARCH-RULE-006, description: "Permisos por tabla conformes a la política", type: AUTOMATED, evidence: "Postflight Q9 y 18 pruebas de permisos de `ciclo_completo.sh`", expected: "0 permisos fuera de política", current_state: "PASS"}
    - {id: FIT-007, rule: ARCH-RULE-007, description: "SSL obligatorio y secretos fuera del repositorio", type: HYBRID, evidence: "Prueba «conexión sin SSL rechazada»; escaneo de secretos en el pipeline", expected: "Conexión sin SSL rechazada; ningún secreto en el repositorio", current_state: "PASS el SSL; el escaneo de secretos es NOT_VERIFIABLE (no hay pipeline)"}
    - {id: FIT-008, rule: ARCH-RULE-008, description: "Sin acceso entre contextos fuera de los contratos", type: HYBRID, evidence: "Prueba de permisos entre esquemas; pruebas de contrato por cada CON-xx", expected: "El servicio de un contexto no lee otro esquema; cada contrato cumple su esquema", current_state: "PASS los permisos; las pruebas de contrato son NOT_VERIFIABLE"}
    - {id: FIT-009, rule: ARCH-RULE-009, description: "EVT-01 idempotente y sin eventos obsoletos", type: HYBRID, evidence: "Pruebas SQL de K-42 y K-46 (4 pruebas); pruebas del consumidor", expected: "Un evento repetido o antiguo no modifica la plaza", current_state: "PASS en SQL; el consumidor es NOT_VERIFIABLE"}
    - {id: FIT-010, rule: ARCH-RULE-010, description: "Réplica de GitLab de solo lectura y carga tolerante", type: HYBRID, evidence: "Prueba «svc_gitlab no inserta réplicas»; prueba del proceso de carga con un issue de otro tipo", expected: "La carga completa sin fallar y registra lo ignorado", current_state: "PASS los permisos; el proceso de carga es NOT_VERIFIABLE"}
    - {id: FIT-011, rule: ARCH-RULE-011, description: "Vínculo inmutable y sin auto-registro", type: HYBRID, evidence: "Pruebas de permisos por columna sobre `usuario.persona_ref` y de K-43, K-44, K-45; prueba del flujo de login con CON-13", expected: "Solo la cuenta de corrección cambia el vínculo", current_state: "PASS en la base; el flujo de login es NOT_VERIFIABLE"}
    - {id: FIT-012, rule: ARCH-RULE-012, description: "Columnas de actor con el GUID de Keycloak", type: AUTOMATED, evidence: "Consulta a `information_schema.columns`: las columnas `*_por_ref` de actor son `CHAR(36)` `ascii_bin`. **La consulta no existe todavía y debe escribirse**", expected: "Todas conformes", current_state: "NOT_VERIFIABLE (por escribir)"}
    - {id: FIT-013, rule: ARCH-RULE-013, description: "Contratos y eventos sin datos personales", type: HYBRID, evidence: "Prueba de contrato con lista blanca de campos; revisión de los registros de integración", expected: "Ningún campo personal en los mensajes", current_state: "NOT_VERIFIABLE (no existen los servicios)"}
